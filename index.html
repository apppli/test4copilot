<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Background</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #003366, #001133);
            overflow: hidden;
            position: relative;
        }
        
        /* Water ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(135, 206, 235, 0.4) 0%, transparent 70%);
            animation: rippleEffect 4s infinite ease-out;
            pointer-events: none;
        }
        
        .ripple:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 20%;
            left: 30%;
            animation-delay: 0s;
        }
        
        .ripple:nth-child(2) {
            width: 400px;
            height: 400px;
            top: 60%;
            left: 70%;
            animation-delay: 1s;
        }
        
        .ripple:nth-child(3) {
            width: 250px;
            height: 250px;
            top: 40%;
            left: 10%;
            animation-delay: 2s;
        }
        
        .ripple:nth-child(4) {
            width: 350px;
            height: 350px;
            top: 10%;
            left: 80%;
            animation-delay: 3s;
        }
        
        @keyframes rippleEffect {
            0% {
                transform: scale(0.1);
                opacity: 1;
            }
            50% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }
        
        .welcome {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #87CEEB;
            text-shadow: 2px 2px 8px #003366, 0 0 20px rgba(135, 206, 235, 0.5);
            opacity: 0;
            animation: fadeInScale 2s ease-out forwards;
            z-index: 10;
        }
        
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            80% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="welcome">Welcome!</div>
</body>
</html>
